<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="t d">
<title id="t">Tasse (petite taille), symbole Services</title>
<desc id="d">Une tasse au trait blanc, un œil ouvert au centre et deux petits cœurs rouges ; une rose rouge et une fleur en forme de cœur sortent de la tasse sur des tiges feuillues ; à droite une main fine (paume, quatre doigts et un pouce, poignet mince) retombe mollement par-dessus le bord comme une plante fanée, à la manière des montres molles de Dalí. Version simplifiée pour 64 px.</desc>
